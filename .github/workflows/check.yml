name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build.mjs
      - run: pnpm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/build.mjs --assets-only
      - name: Browser suite against an isolated preview server
        env:
          PORT: "4204"
          CREATE_LIMIT_PER_HOUR: "100"
          JOIN_LIMIT_PER_10_MIN: "150"
        run: |
          export DATA_DIR="$(mktemp -d)"
          node server.mjs > "$RUNNER_TEMP/preview.log" 2>&1 &
          for _ in $(seq 30); do curl -sf http://127.0.0.1:4204/ > /dev/null && break; sleep 1; done
          pnpm exec playwright test tests/design.spec.js --workers=1
      - run: node scripts/evidence.mjs reproduce
      - run: node scripts/evidence.mjs measure
      - run: node scripts/evidence.mjs diagnose
